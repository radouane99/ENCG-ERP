name: Deploy ENCG-ERP to Production

on:
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: 'Reuse existing frontend/dist on the VPS'
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Gate — tests + production frontend build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encg_erp_test
          POSTGRES_USER: encg_user
          POSTGRES_PASSWORD: encg_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, dom, fileinfo, gd, zip, bcmath, intl
          coverage: none
      - name: Install PHP Dependencies
        working-directory: ./backend
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist
      - name: Configure testing env
        working-directory: ./backend
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password
      - name: Migrate & test
        working-directory: ./backend
        run: |
          php artisan migrate --force --env=testing
          php artisan test --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require VPS secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          [ -n "$DEPLOY_HOST" ] || { echo "Missing secret DEPLOY_HOST"; missing=1; }
          [ -n "$DEPLOY_USER" ] || { echo "Missing secret DEPLOY_USER"; missing=1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "Missing secret DEPLOY_SSH_KEY"; missing=1; }
          exit "$missing"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/ENCG-ERP-V1 || cd /opt/encg-erp || cd /var/www/encg-erp || exit 1
            git fetch origin docker-v2
            git checkout docker-v2
            git pull --ff-only origin docker-v2
            chmod +x deploy.sh scripts/deploy-preflight.sh scripts/provision-ssl.sh scripts/backup-postgres.sh
            if [ "${{ github.event.inputs.skip_frontend }}" = "true" ]; then
              ./deploy.sh --no-git --skip-frontend docker-v2
            else
              ./deploy.sh --no-git docker-v2
            fi
