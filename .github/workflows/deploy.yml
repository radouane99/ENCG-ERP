name: Deploy ENCG-ERP to Production

on:
  push:
    branches:
      - docker-v2
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encg_erp_test
          POSTGRES_USER: encg_user
          POSTGRES_PASSWORD: encg_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, dom, fileinfo, gd, zip, bcmath, intl
          coverage: none

      - name: Install PHP Dependencies
        working-directory: ./backend
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Generate key for testing
        working-directory: ./backend
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password

      - name: Run Database Migrations
        working-directory: ./backend
        run: php artisan migrate --force --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password

      - name: Run PHP Tests
        working-directory: ./backend
        run: php artisan test --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect VPS secrets
        id: vps
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST secret is empty — skip SSH."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH deploy docker-v2
        if: steps.vps.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/ENCG-ERP-V1 || cd /opt/encg-erp || exit 1
            git fetch origin docker-v2
            git checkout docker-v2
            git pull --ff-only origin docker-v2
            ./deploy.sh docker-v2