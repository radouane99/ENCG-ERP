name: Observability and infrastructure configuration

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'docker/monitoring/**'
      - 'docker-compose.monitoring.yml'
      - 'scripts/setup_monitoring.py'
      - 'scripts/tests/**'
      - '.github/workflows/observability-infra.yml'
  push:
    branches: [main, master, docker-v2]
    paths:
      - 'infra/**'
      - 'docker/monitoring/**'
      - 'docker-compose.monitoring.yml'
      - 'scripts/setup_monitoring.py'
      - 'scripts/tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.1
      - name: Validate portable Terraform bootstrap without cloud credentials
        working-directory: infra/terraform/bootstrap
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Verify secret setup without real credentials
        run: python3 -m unittest discover -s scripts/tests
      - name: Validate isolated staging configuration
        run: |
          python3 scripts/setup_staging.py
          docker compose --env-file .env.staging -f docker-compose.staging.yml config --quiet
      - name: Validate Prometheus configuration and alert expressions
        run: |
          printf '%s' 'synthetic-token-used-only-for-config-validation' > "$RUNNER_TEMP/metrics-token"
          docker run --rm \
            -v "$PWD/docker/monitoring:/etc/prometheus:ro" \
            -v "$RUNNER_TEMP/metrics-token:/run/secrets/metrics_token:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.15.1 \
            check config /etc/prometheus/prometheus.yml
