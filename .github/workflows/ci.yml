name: ENCG-ERP CI / Quality Gate

on:
  push:
    branches:
      - docker-v2
      - main
      - master
  pull_request:
    branches:
      - docker-v2
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: 🐘 Backend Tests & Migrations (PHP 8.4 + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encg_erp_test
          POSTGRES_USER: encg_user
          POSTGRES_PASSWORD: encg_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: 🐘 Setup PHP 8.4 & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, dom, fileinfo, gd, zip, bcmath, intl, pcov
          coverage: pcov

      - name: ⚡ Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 📦 Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: 🔑 Configure Environment & App Key
        run: |
          cp .env.example .env.testing
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env.testing
          echo "DB_HOST=127.0.0.1" >> .env.testing
          echo "DB_PORT=5432" >> .env.testing
          echo "DB_DATABASE=encg_erp_test" >> .env.testing
          echo "DB_USERNAME=encg_user" >> .env.testing
          echo "DB_PASSWORD=encg_password" >> .env.testing
          php artisan key:generate --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password

      - name: 🗄️ Run Database Migrations
        run: php artisan migrate --force --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password

      - name: 🧪 Execute Pest / PHPUnit Test Suite
        run: |
          cp phpunit.postgres.xml phpunit.xml
          php artisan test --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password

  frontend-quality:
    name: ⚛️ Frontend Lint, Tests & Production Build (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🔍 Linter Validation (oxlint)
        run: npm run lint

      - name: Dependency security audit (blocking)
        run: npm audit --audit-level=high

      - name: 🛡️ TypeScript Typecheck
        run: npx tsc --noEmit

      - name: 🧪 Execute Vitest Suites
        run: npm run test -- --run

      - name: 🚀 Verify Production Vite Build
        run: npm run build

      - name: Initial JavaScript budget
        run: npm run build:stats

  e2e-critical-journeys:
    name: 🎭 Playwright — 8 parcours critiques
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encg_e2e_test
          POSTGRES_USER: encg_user
          POSTGRES_PASSWORD: encg_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: encg_e2e_test
      DB_USERNAME: encg_user
      DB_PASSWORD: encg_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      AI_DRIVER: stub
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, dom, fileinfo, gd, zip, bcmath, intl
      - name: Prepare real API against an isolated database
        working-directory: ./backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env.testing
          php artisan key:generate --env=testing
          php artisan migrate --env=testing --force
          php artisan db:seed --env=testing --class=E2eSmokeSeeder --force
          php artisan serve --no-reload --env=testing --host=127.0.0.1 --port=8000 > /tmp/encg-e2e-api.log 2>&1 &
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true
          E2E_LIVE: '1'
          E2E_PRODUCTION: '1'
          E2E_API_URL: http://127.0.0.1:8000/api
          E2E_API_PROXY_URL: http://127.0.0.1:8000

  security-regression:
    name: 🔐 Security regression (P0 routes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encg_erp_test
          POSTGRES_USER: encg_user
          POSTGRES_PASSWORD: encg_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, dom, fileinfo, gd, zip, bcmath, intl
          coverage: none
      - run: composer install --no-ansi --no-interaction --no-progress --prefer-dist
      - run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
      - run: php artisan migrate --force --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password
      - run: php artisan test --configuration=phpunit.postgres.xml --env=testing --filter=SensitiveRoutesRequireAuthenticationTest
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password

  code-quality-and-security:
    name: 🔒 Code Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: 🐘 Setup PHP for Code Styling
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: 📦 Install Composer Dependencies (Backend)
        working-directory: ./backend
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: 🎨 Laravel Pint Code Style Check
        working-directory: ./backend
        continue-on-error: true
        run: php vendor/bin/pint --test

      - name: Composer security audit (blocking)
        working-directory: ./backend
        run: composer audit --locked --no-dev --abandoned=report

  backup-restore-drill:
    name: 🗄️ Postgres restore drill (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Restore an isolated PostgreSQL backup
        run: |
          set -euo pipefail
          bash -n scripts/backup-postgres.sh
          bash -n scripts/restore-postgres-drill.sh
          docker run -d --name encg_ci_drill -e POSTGRES_PASSWORD=test-only postgres:16-alpine
          trap 'docker rm -f encg_ci_drill' EXIT
          for i in $(seq 1 30); do
            docker exec encg_ci_drill pg_isready -U postgres && break
            sleep 1
          done
          docker exec encg_ci_drill psql -U postgres -c 'CREATE TABLE users(id int); CREATE TABLE students(id int); CREATE TABLE grades(id int); INSERT INTO users VALUES (1);'
          docker exec encg_ci_drill pg_dump -U postgres postgres | gzip > /tmp/encg_ci_drill.sql.gz
          PG_CONTAINER=encg_ci_drill DB_USERNAME=postgres DRILL_MIN_TABLES=3 bash scripts/restore-postgres-drill.sh /tmp/encg_ci_drill.sql.gz
