name: ENCG-ERP CI / Quality Gate

on:
  push:
    branches:
      - docker-v2
  pull_request:
    branches:
      - docker-v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: 🐘 Backend Tests & Migrations (PHP 8.4 + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encg_erp_test
          POSTGRES_USER: encg_user
          POSTGRES_PASSWORD: encg_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4 & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, dom, fileinfo, gd, zip, bcmath, intl, pcov
          coverage: pcov

      - name: ⚡ Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 📦 Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: 🔑 Configure Environment & App Key
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password

      - name: 🗄️ Run Database Migrations
        run: php artisan migrate --force --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password

      - name: 🧪 Execute Pest / PHPUnit Test Suite
        run: php artisan test --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: encg_erp_test
          DB_USERNAME: encg_user
          DB_PASSWORD: encg_password

  frontend-quality:
    name: ⚛️ Frontend Lint, Tests & Production Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🔍 Linter Validation (oxlint)
        run: npm run lint

      - name: 🛡️ TypeScript Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: 🧪 Execute Vitest Suites
        run: npm run test -- --run

      - name: 🚀 Verify Production Vite Build
        run: npm run build

  code-quality-and-security:
    name: 🔒 Code Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP for Code Styling
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: 📦 Install Composer Dependencies (Backend)
        working-directory: ./backend
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: 🎨 Laravel Pint Code Style Check
        working-directory: ./backend
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: 🛡️ Composer Security Audit
        working-directory: ./backend
        run: composer audit --abandoned=report
        continue-on-error: true
