server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Security Headers for all served responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve React Frontend (assuming it's in /var/www/html/public/dist)
    # Actually, a better setup is separating them or alias
    # Let's route all non-api traffic to the React index.html
    
    location / {
        alias /var/www/html/public/dist/;
        try_files $uri $uri/ /index.html;
    }

    # Serve Laravel API and Sanctum routes
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Storage access: strictly prevent execution of any PHP scripts
    location ^~ /storage/ {
        try_files $uri $uri/ /index.php?$query_string;
        location ~ \.php$ {
            deny all;
        }
    }

    # Pass PHP scripts to PHP-FPM container
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
