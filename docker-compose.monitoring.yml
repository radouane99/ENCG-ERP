name: encg-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    networks: [monitoring, erp]
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges:true]

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_password
    networks: [monitoring, dashboard]
    mem_limit: 384m
    cpus: 0.5
    security_opt: [no-new-privileges:true]

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./docker/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [monitoring, erp]
    mem_limit: 96m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

secrets:
  metrics_token:
    file: ./.monitoring-secrets/metrics-token
  grafana_password:
    file: ./.monitoring-secrets/grafana-password

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    internal: true
  dashboard:
    driver: bridge
  erp:
    external: true
    name: ${ERP_NETWORK:?Run scripts/setup_monitoring.py with the existing ERP Docker network}
