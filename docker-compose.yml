services:

  operations-scheduler: &operations-runner
    profiles: [operations]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ${OPERATIONS_IMAGE:-encg-erp-v1-backend}
    entrypoint: &php-entrypoint ['/bin/sh', '/usr/local/bin/docker-entrypoint.sh']
    command: php artisan schedule:work
    env_file: ./backend/.env
    environment:
      OPERATIONS_ONLY_SCHEDULER: 'true'
      BACKUP_NOTIFICATION_EMAIL: ''
    volumes:
      - ./backend:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/php/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    networks: [encgnet]
    restart: unless-stopped

  operations-alerts:
    <<: *operations-runner
    command: sh -lc 'while true; do php artisan operations:send-alerts; sleep 300; done'

  # ──────────────────────────────────────────────────────────
  # Nginx — Reverse proxy + static assets
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: encg_nginx
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:cached
    depends_on:
      - backend
      - frontend
    networks:
      - encgnet
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Backend — Laravel 12 / PHP 8.4-FPM (Alpine)
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: encg_backend
    entrypoint: *php-entrypoint
    command: php-fpm
    env_file:
      - ./backend/.env
    environment:
      APP_DEBUG: 'false'
    volumes:
      - ./backend:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/php/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - encgnet
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Laravel Reverb — WebSocket server
  # ──────────────────────────────────────────────────────────
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: encg_reverb
    entrypoint: *php-entrypoint
    command: php artisan reverb:start --host="0.0.0.0" --port=8080 --no-interaction
    ports:
      - '8080:8080'
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/php/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - encgnet
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Laravel Horizon — Queue worker
  # ──────────────────────────────────────────────────────────
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: encg_queue_worker
    entrypoint: *php-entrypoint
    command: php artisan horizon
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/php/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - encgnet
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Frontend — React + Vite (dev server)
  # ──────────────────────────────────────────────────────────
  frontend:
    image: node:22-alpine
    container_name: encg_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    ports:
      - '5173:5173'
    command: sh -c "which chromium >/dev/null 2>&1 || apk add --no-cache chromium; npm install && npm run dev -- --host"
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - encgnet
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: encg_postgres
    env_file:
      - path: .env.database-maintenance
        required: false
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: encg_erp
      POSTGRES_USER: encg
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - encgnet
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U encg -d encg_erp']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Redis — Cache / Sessions / Queues
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: encg_redis
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --requirepass secret --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - encgnet
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'secret', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Mailpit — Local SMTP + Web UI
  # ──────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: encg_mailpit
    ports:
      - '127.0.0.1:1025:1025'   # SMTP
      - '127.0.0.1:8025:8025'   # Web UI → http://localhost:8025
    networks:
      - encgnet
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # pgAdmin — PostgreSQL Web UI
  # ──────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: encg_pgadmin
    ports:
      - '127.0.0.1:5050:80'     # Web UI → http://localhost:5050
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@encg.ma
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - encgnet
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Cloudflare Tunnel — expose nginx without opening ports
  # In Zero Trust, set the public hostname origin to http://nginx:80
  # Token lives in repo-root .env as CLOUDFLARE_TUNNEL_TOKEN
  # ──────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: encg_cloudflared
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - encgnet
    restart: unless-stopped

# ──────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────
networks:
  encgnet:
    driver: bridge

# ──────────────────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
