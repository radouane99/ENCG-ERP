# Compose 2.24.4+ is required for !override.
# Frontend assets and public files belong to the versioned web image.
services:
  backend:
    build: !reset null
  queue-worker:
    build: !reset null
  scheduler:
    build: !reset null
  operations-alerts:
    build: !reset null
  reverb:
    build: !reset null
  nginx:
    volumes: !override
      - ./docker/nginx/${NGINX_CONF:-prod.conf}:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/html/storage:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
