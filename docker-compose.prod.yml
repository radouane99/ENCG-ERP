services:

  # ──────────────────────────────────────────────────────────
  # Nginx — Production Web Server & Reverse Proxy
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: encg_prod_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html/dist:ro
      - ./backend/public:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - encg_prod_net

  # ──────────────────────────────────────────────────────────
  # Backend — Laravel 12 / PHP 8.4-FPM Production
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: encg_prod_backend
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend:/var/www/html
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - encg_prod_net

  # ──────────────────────────────────────────────────────────
  # Queue Worker / Horizon
  # ──────────────────────────────────────────────────────────
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: encg_prod_queue
    restart: always
    command: php artisan horizon
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend:/var/www/html
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - encg_prod_net

  # ──────────────────────────────────────────────────────────
  # Scheduler (Cron)
  # ──────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: encg_prod_scheduler
    restart: always
    command: php artisan schedule:work
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend:/var/www/html
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      backend:
        condition: service_started
    networks:
      - encg_prod_net

  # ──────────────────────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: encg_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-encg_erp}
      POSTGRES_USER: ${DB_USERNAME:-encg_prod_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-encg_prod_secure_password_2026}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - encg_prod_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-encg_prod_user} -d ${DB_DATABASE:-encg_erp}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: encg_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret_redis_2026} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - encg_prod_net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-secret_redis_2026}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # Certbot — Automatic SSL / TLS
  # ──────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: encg_prod_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - encg_prod_net

networks:
  encg_prod_net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  storage_data:
  bootstrap_cache:
