x-application: &application
  image: encg-erp-backend:${ERP_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
  restart: always
  env_file:
    - ./backend/.env.production
  environment:
    APP_ENV: production
    APP_DEBUG: 'false'
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  volumes:
    - storage_data:/var/www/html/storage
    - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/custom.ini:ro
  networks:
    - encg_prod_net

services:
  nginx:
    image: nginx:alpine
    container_name: encg_prod_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/${NGINX_CONF:-prod-bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html/dist:ro
      - ./backend/public:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      reverb:
        condition: service_started
    networks:
      - encg_prod_net

  backend:
    <<: *application
    container_name: encg_prod_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  queue-worker:
    <<: *application
    container_name: encg_prod_queue
    command: php artisan horizon
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *application
    container_name: encg_prod_scheduler
    command: php artisan schedule:work
    depends_on:
      backend:
        condition: service_healthy

  reverb:
    <<: *application
    container_name: encg_prod_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: encg_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in backend/.env.production}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in backend/.env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env.production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - encg_prod_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: encg_prod_redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in backend/.env.production}
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in backend/.env.production} --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    volumes:
      - redis_prod_data:/data
    networks:
      - encg_prod_net
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 5s
      retries: 5

  certbot:
    image: certbot/certbot:latest
    container_name: encg_prod_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - encg_prod_net

networks:
  encg_prod_net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  storage_data:
