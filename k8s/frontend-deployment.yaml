apiVersion: v1
kind: Service
metadata:
  name: encg-frontend
  namespace: encg-erp
spec:
  selector:
    app: encg-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encg-frontend
  namespace: encg-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: encg-frontend
  template:
    metadata:
      labels:
        app: encg-frontend
    spec:
      containers:
        - name: frontend
          image: encg-erp-v1-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

