apiVersion: v1
kind: Service
metadata:
  name: encg-redis
  namespace: encg-erp
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  clusterIP: None
  selector:
    app: encg-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: encg-redis
  namespace: encg-erp
spec:
  serviceName: "encg-redis"
  replicas: 1
  selector:
    matchLabels:
      app: encg-redis
  template:
    metadata:
      labels:
        app: encg-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - "sh"
            - "-c"
            - "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\" --maxmemory 512mb --maxmemory-policy noeviction"
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: encg-erp-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "600Mi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: redis-storage
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

