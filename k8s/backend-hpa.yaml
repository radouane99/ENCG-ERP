# Auto-scales ENCG Backend API pods during peak academic bursts
# (e.g. Deliberation results release, S1-S10 exam convocations, Pre-registration)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: encg-backend-hpa
  namespace: encg-erp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: encg-backend
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# Auto-scales Horizon Queue Workers during bulk PDF generation & Resend emails
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: encg-horizon-hpa
  namespace: encg-erp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: encg-horizon
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

