apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: encg-erp-ingress
  namespace: encg-erp
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Block public access to internal debug dashboards (/horizon, /telescope, /docs)
    nginx.ingress.kubernetes.io/server-snippet: |
      location ^~ /horizon { return 404; }
      location ^~ /telescope { return 404; }
      location ^~ /docs { return 404; }
spec:
  tls:
    - hosts:
        - erp.encg-fes.ac.ma
      secretName: encg-erp-tls
  rules:
    - host: erp.encg-fes.ac.ma
      http:
        paths:
          # Laravel API, Sanctum, Healthcheck & Public Document Verification
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: encg-backend
                port:
                  number: 80
          - path: /sanctum
            pathType: Prefix
            backend:
              service:
                name: encg-backend
                port:
                  number: 80
          - path: /verify
            pathType: Prefix
            backend:
              service:
                name: encg-backend
                port:
                  number: 80
          - path: /up
            pathType: Exact
            backend:
              service:
                name: encg-backend
                port:
                  number: 80
          # Laravel Reverb WebSockets (/app/{key})
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: encg-reverb
                port:
                  number: 8080
          # React 19 PWA / SPA Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: encg-frontend
                port:
                  number: 80

