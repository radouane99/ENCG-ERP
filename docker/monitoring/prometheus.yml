global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    application: encg-erp

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: encg-application
    metrics_path: /api/internal/metrics
    scrape_timeout: 15s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['nginx:80']

  - job_name: encg-readiness
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets: ['http://nginx:80/api/health/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
