; ──────────────────────────────────────────
; PHP 8.4 — Custom Configuration (ENCG ERP)
; ──────────────────────────────────────────

[PHP]
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 50M
post_max_size = 55M
max_file_uploads = 30
display_errors = Off
display_startup_errors = Off
expose_php = Off
cgi.fix_pathinfo = 0
log_errors = On
error_log = /var/log/php/php_errors.log
date.timezone = Africa/Casablanca
realpath_cache_size = 16M
realpath_cache_ttl = 120

; ──────────────────────────────────────────
; OPcache (production-style settings)
; ──────────────────────────────────────────
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
; Avoid restatting every included file on each request over Windows bind mounts.
; Source edits remain visible within two seconds in development.
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

; ──────────────────────────────────────────
; Xdebug (disabled by default)
; ──────────────────────────────────────────
[xdebug]
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = trigger
