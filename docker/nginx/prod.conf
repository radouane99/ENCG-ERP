# ── Rate Limiting Zone ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ── HTTP: ACME Challenge & HTTPS Redirection ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS (or fallback to app if SSL not yet provisioned)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: ENCG ERP Main Application & API ─────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/encg-erp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/encg-erp/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    client_max_body_size 100M;
    root /var/www/html/dist;
    index index.html;

    # ── Static Frontend Assets (Vite Hash Caching) ───────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Backend API & Authentication ─────────────────────────
    location ~ ^/(api|sanctum|up|horizon|docs|storage|verify|documents) {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;

        limit_req zone=api_limit burst=50 nodelay;

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass backend:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 300;
        }
    }

    # ── Single Page Application (React Router fallback) ──────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
